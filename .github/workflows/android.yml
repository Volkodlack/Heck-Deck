# Compile l'APK Android à chaque push sur main (APK de test en artefact)
# et publie une Release GitHub avec l'APK quand on pousse un tag vX.Y.Z.
name: APK Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      HEXDECK_VERSION_CODE: ${{ github.run_number }}
      HEXDECK_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Build web
        run: npm run build -w client
      - name: Capacitor sync
        working-directory: client
        run: npx cap sync android

      - name: Keystore (si les secrets sont configurés)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hexdeck.jks"
            echo "path=$RUNNER_TEMP/hexdeck.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Gradle build
        working-directory: client/android
        env:
          HEXDECK_KEYSTORE: ${{ steps.keystore.outputs.path }}
          HEXDECK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEXDECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEXDECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$HEXDECK_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p ../../apk
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../../apk/ \;
          cd ../../apk && for f in *.apk; do mv "$f" "hexdeck-${HEXDECK_VERSION_NAME}-${f#app-}"; done && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: hexdeck-apk
          path: apk/*.apk

      - name: Release GitHub (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
